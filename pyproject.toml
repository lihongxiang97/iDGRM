[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idgrm"
version = "1.0.0"
description = "Duplicate-gene expression-pattern classification and optional outgroup polarization"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "iDGRM contributors"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9"
]

[project.scripts]
idgrm = "idgrm.cli:main"

[tool.setuptools.packages.find]
include = ["idgrm*"]

[tool.setuptools.package-data]
idgrm = ["data/*.tsv", "resources/*.R"]
